# Collecte de nuit des dates (US1.5, §6) : ATHX et Deadly Dozen.
# Collecte, valide, applique le garde-fou, ouvre un ticket en cas d'anomalie, commite sur main et redéploie.
# Le robot (GitHub Actions) est autorisé à contourner la protection de main (décision D4) : il valide avant d'écrire.
name: Collecte des dates

on:
  schedule:
    - cron: "17 2 * * *" # 4 h 17 à Paris (heure d'été), 3 h 17 en hiver
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: collecte
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  collecter:
    name: Collecter et publier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Collecter (1 passage par source, requêtes identifiées et espacées)
        run: node scripts/collect/run.ts
        env:
          COLLECT_REPORT: ${{ runner.temp }}/collecte.json

      - name: Mettre en forme les fichiers collectés
        run: npx biome format --write data/events

      - name: Valider (données, tests, build)
        run: npm run validate:data && npm test && npm run build

      - name: Ouvrir ou compléter un ticket par source en anomalie
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/collecte.json
        run: |
          gh label create collecte --color FF8A3D --description "Collecte automatique des dates" --force
          jq -c '.[]' "$REPORT" | while read -r item; do
            source=$(echo "$item" | jq -r .source)
            anomaly=$(echo "$item" | jq -r .anomaly)
            title="Dates à vérifier : $source"
            body="La collecte du $(date -u +%F) a gardé les dates précédentes de **$source** (marquées « à vérifier » sur le site).

          Raison : $anomaly

          À faire : vérifier le site de l'organisateur ; si besoin, corriger les dates dans \`data/events-manual/\` (prioritaire sur la collecte) ou adapter le collecteur \`scripts/collect/\`."
            existing=$(gh issue list --state open --label collecte --search "in:title \"$title\"" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label collecte --body "$body"
            fi
          done

      - name: Enregistrer sur main
        id: enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "chore(dates): collecte du $(date -u +%F)"
          git push
          echo "publie=true" >> "$GITHUB_OUTPUT"

      # Un commit fait avec le jeton du workflow ne déclenche pas les autres workflows : on lance le déploiement.
      - name: Redéployer le site
        if: steps.enregistrer.outputs.publie == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
