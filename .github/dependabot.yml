# Propositions de mises à jour chaque semaine, chacune vérifiée par la CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 n'est pas encore accepté par @astrojs/check ni @astrojs/svelte
      # (peer typescript ^5 || ^6). À retirer quand ils le prendront en charge.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Les mises à jour mineures et correctifs arrivent groupés en une seule Pull Request.
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
